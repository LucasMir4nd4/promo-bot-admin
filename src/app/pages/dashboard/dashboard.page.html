<div class="dashboard">

  <!-- Fundo com grid decorativo -->
  <div class="bg-grid"></div>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <img src="assets/logo.png" alt="Lucão da Promoção" class="logo-img" />
        <div class="logo-text">
          <span class="logo-name">Lucão da Promoção</span>
          <span class="logo-sub mono">ADMIN PANEL</span>
        </div>
      </div>
    </div>

    <div class="topbar-center">
      <div class="url-display mono">
        <span class="url-dot"></span>
        {{ api.baseUrl() }}
      </div>
    </div>

    <div class="topbar-right">
      <span class="timestamp mono">{{ agora | date:'dd/MM HH:mm' }}</span>
      <button class="config-btn" (click)="abrirConfig()" title="Configurações">
        ⚙️ Config
      </button>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main class="main-content">

    <!-- Linha superior: Status + Executar Mercado Livre -->
    <div class="top-row">
      <app-health-card class="card-col" />
      <app-mercadolivre-btn class="card-col" />
    </div>

    <!-- Worker de automação: o Python que gera os links de afiliado.
         Vem logo abaixo do status do bot porque responde a mesma pergunta —
         "a esteira está de pé?" — só que da outra metade dela. -->
    <div class="full-row">
      <app-worker-card />
    </div>

    <!-- Linha AliExpress + OAuth do Mercado Livre -->
    <div class="top-row">
      <app-aliexpress-btn class="card-col" />
      <app-ml-auth-card class="card-col" />
    </div>

    <!-- Diagnóstico da integração com o ML (linha completa) -->
    <div class="full-row">
      <app-ml-diagnostico />
    </div>

    <!-- Diagnóstico da OpenAI: a copy das promoções (linha completa) -->
    <div class="full-row">
      <app-openai-diagnostico />
    </div>

    <!-- O que o bot busca: categorias das duas fontes + palavras-chave.
         Substitui o antigo card "Categorias do Mercado Livre", que só listava
         os IDs para copiar e colar no application.yml — agora a escolha é salva
         no banco e o próximo ciclo já usa. -->
    <div class="full-row">
      <app-filtros-captura />
    </div>

    <!-- WhatsApp: conexão via QR Code (linha completa) -->
    <div class="full-row">
      <app-whatsapp-card />
    </div>

    <!-- Links fixos (linha completa) -->
    <div class="full-row">
      <app-links-fixos />
    </div>

    <!-- Tabela de produtos (linha completa) -->
    <div class="full-row">
      <app-produtos-table />
    </div>

  </main>

  <!-- Modal de configurações -->
  <app-config-modal
    *ngIf="configAberto()"
    (fechar)="fecharConfig()"
  />

</div>
