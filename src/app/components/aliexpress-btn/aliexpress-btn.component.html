<div class="executar-card fade-in fade-in-4">

  <!-- Header -->
  <div class="card-header">
    <div class="card-title">
      <span class="icon">🛒</span>
      <span>AliExpress</span>
    </div>
  </div>

  <!-- Descrição -->
  <p class="card-desc">
    Força a execução imediata do ciclo de busca de promoções do AliExpress, sem aguardar o scheduler automático.
  </p>

  <!-- Botão principal -->
  <button
    class="executar-btn"
    [ngClass]="estado"
    (click)="executar()"
    [disabled]="estado === 'loading'">

    <span *ngIf="estado === 'idle'" class="btn-content">
      <span class="btn-icon">▶</span> EXECUTAR ALIEXPRESS
    </span>

    <span *ngIf="estado === 'loading'" class="btn-content">
      <span class="spinner"></span> EXECUTANDO...
    </span>

    <span *ngIf="estado === 'success'" class="btn-content">
      <span class="btn-icon">✓</span> CONCLUÍDO
    </span>

    <span *ngIf="estado === 'error'" class="btn-content">
      <span class="btn-icon">✗</span> ERRO
    </span>

  </button>

  <!-- Feedback de resultado -->
  <div class="resultado" *ngIf="mensagem && estado !== 'loading'">
    <div class="resultado-msg" [ngClass]="estado === 'success' ? 'success' : 'error'">
      {{ mensagem }}
    </div>
    <div class="produtos-count" *ngIf="produtosEnviados !== null && estado === 'success'">
      <span class="count-num">{{ produtosEnviados }}</span>
      <span class="count-label">produto(s) enviado(s)</span>
    </div>
  </div>

  <!-- Terminal de logs -->
  <div class="log-terminal" *ngIf="logs.length > 0">
    <div class="log-header">
      <span class="mono">LOG</span>
      <button class="clear-btn" (click)="limparLogs()">limpar</button>
    </div>
    <div class="log-body">
      <div class="log-line" *ngFor="let log of logs">{{ log }}</div>
    </div>
  </div>

</div>
