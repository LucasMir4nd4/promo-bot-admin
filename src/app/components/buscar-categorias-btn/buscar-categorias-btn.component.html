<div class="executar-card fade-in fade-in-3">

  <!-- Header -->
  <div class="card-header">
    <div class="card-title">
      <span class="icon">🔍</span>
      <span>Categorias do Mercado Livre</span>
    </div>
    <span class="categorias-total mono" *ngIf="categorias.length">
      {{ categorias.length }} categorias
    </span>
  </div>

  <!-- Descrição -->
  <p class="card-desc">
    Consulta as categorias raiz do Mercado Livre. Use os IDs (MLB…) para configurar
    quais categorias o bot varre em busca de promoções — clique num ID para copiar.
  </p>

  <!-- Botão principal -->
  <button
    class="executar-btn"
    [ngClass]="estado"
    (click)="executar()"
    [disabled]="estado === 'loading'">

    <span *ngIf="estado === 'idle'" class="btn-content">
      <span class="btn-icon">🔍</span> BUSCAR CATEGORIAS
    </span>

    <span *ngIf="estado === 'loading'" class="btn-content">
      <span class="spinner"></span> BUSCANDO...
    </span>

    <span *ngIf="estado === 'success'" class="btn-content">
      <span class="btn-icon">✓</span> CONCLUÍDO
    </span>

    <span *ngIf="estado === 'error'" class="btn-content">
      <span class="btn-icon">✗</span> ERRO
    </span>

  </button>

  <!-- Feedback de resultado -->
  <div class="resultado" *ngIf="mensagem && estado !== 'loading'">
    <div class="resultado-msg" [ngClass]="estado === 'error' ? 'error' : 'success'">
      {{ mensagem }}
    </div>
  </div>

  <!-- Lista de categorias retornadas -->
  <div class="categorias-grid" *ngIf="categorias.length">
    <button
      type="button"
      class="categoria-item"
      *ngFor="let c of categorias"
      [class.copiado]="idCopiado === c.id"
      (click)="copiarId(c.id)"
      [title]="'Copiar ' + c.id">
      <span class="categoria-id mono">{{ c.id }}</span>
      <span class="categoria-nome">{{ c.nome }}</span>
      <span class="categoria-copiado mono" *ngIf="idCopiado === c.id">copiado</span>
    </button>
  </div>

  <!-- Terminal de logs -->
  <div class="log-terminal" *ngIf="logs.length > 0">
    <div class="log-header">
      <span class="mono">LOG</span>
      <button class="clear-btn" (click)="limparLogs()">limpar</button>
    </div>
    <div class="log-body">
      <div class="log-line" *ngFor="let log of logs">{{ log }}</div>
    </div>
  </div>

</div>
